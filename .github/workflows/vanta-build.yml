# Build the Vanta fork separately from the upstream release pipelines.
name: Vanta Explorer Windows build

on:
  workflow_dispatch:
  push:
    branches:
      - vanta/performance-win10

jobs:
  build:
    runs-on: windows-2025-vs2026
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: microsoft/setup-msbuild@v3
      - uses: NuGet/setup-nuget@v3
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Restore app projects
        shell: pwsh
        run: msbuild src/Files.App/Files.App.csproj -t:Restore -p:Configuration=Release -p:Platform=x64 -p:RestoreDisableParallel=true -v:minimal
      - name: Build native launcher
        shell: pwsh
        run: |
          nuget restore src/Files.App.Launcher/Files.App.Launcher.vcxproj -SolutionDirectory "$env:GITHUB_WORKSPACE" -Verbosity quiet
          msbuild src/Files.App.Launcher/Files.App.Launcher.vcxproj -t:Build -p:Configuration=Release -p:Platform=x64 -v:quiet
      - name: Create temporary signing certificate
        shell: pwsh
        run: |
          ./.github/scripts/Generate-SelfCertPfx.ps1 -Destination "$env:RUNNER_TEMP\VantaExplorer.pfx"
          $cert = Get-ChildItem Cert:\CurrentUser\My | Where-Object { $_.Subject -eq 'CN=VantaExplorer' } | Sort-Object NotBefore -Descending | Select-Object -First 1
          Export-Certificate -Cert $cert -FilePath "$env:GITHUB_WORKSPACE\VantaExplorer.cer" -Type CERT | Out-Null
      - name: Build x64 package
        shell: pwsh
        run: |
          msbuild src/Files.App/Files.App.csproj -t:Build `
            -p:Configuration=Release -p:Platform=x64 `
            -p:AppxBundlePlatforms=x64 -p:AppxBundle=Always `
            -p:GenerateAppxPackageOnBuild=true `
            -p:UapAppxPackageBuildMode=SideloadOnly `
            -p:AppxPackageDir="$env:GITHUB_WORKSPACE\artifacts\VantaPackages\" `
            -p:AppxPackageSigningEnabled=true `
            -p:PackageCertificateKeyFile="$env:RUNNER_TEMP\VantaExplorer.pfx" `
            -p:PackageCertificatePassword="" `
            -p:PackageCertificateThumbprint="" -v:quiet
      - name: Upload package and public certificate
        uses: actions/upload-artifact@v7
        with:
          name: VantaExplorer-x64
          path: |
            artifacts/VantaPackages/**/*.msixbundle
            artifacts/VantaPackages/**/*.msix
            VantaExplorer.cer
          if-no-files-found: error
